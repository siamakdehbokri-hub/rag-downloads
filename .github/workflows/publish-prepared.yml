name: Publish prepared installers
on:
  push:
    branches: [codex/release-2-18-1]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and validate the installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          for item in json.load(open('release-parts.json')):
              with open(item['name'],'wb') as out:
                  for sha in item['blobs']:
                      result=subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}",'--jq','.content'])
                      data=base64.b64decode(result)
                      assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
                      out.write(data)
              with open(item['name'],'rb') as f:
                  assert hashlib.file_digest(f,'sha256').hexdigest()==item['sha256']
          PY
      - name: Upload verified files to the prepared release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v2.18.1 Rag-windows-1.2.1.exe Rag-2.18.1.apk
